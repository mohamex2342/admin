<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة احمد البنا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: #0f172a; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
            padding-bottom: 80px; 
        }
        .glass-panel { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .neon-text { text-shadow: 0 0 10px #00d2ff; }
        .btn-active:active { transform: scale(0.95); }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #00d2ff; border-radius: 10px; }
        
        input, textarea { 
            background: rgba(15, 23, 42, 0.8) !important; 
            border: 1px solid rgba(0, 210, 255, 0.2) !important; 
            color: white !important; 
        }
        input:focus, textarea:focus {
            border-color: #00d2ff !important;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen">

    <header class="sticky top-0 z-50 glass-panel p-4 mb-6 border-b border-slate-700 flex items-center justify-center gap-3">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="filter drop-shadow-[0_0_8px_#00d2ff]">
            <path d="M12 6.5C10.07 6.5 8.5 8.07 8.5 10C8.5 11.93 10.07 13.5 12 13.5C13.93 13.5 15.5 11.93 15.5 10C15.5 8.07 13.93 6.5 12 6.5Z" fill="#00d2ff"/>
            <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 11.45 4.05 10.91 4.14 10.38C6.11 9.51 8.35 9 10.74 9C11.17 9 11.59 9.02 12 9.05C12.41 9.02 12.83 9 13.26 9C15.65 9 17.89 9.51 19.86 10.38C19.95 10.91 20 11.45 20 12C20 16.41 16.41 20 12 20Z" fill="#00d2ff" fill-opacity="0.3"/>
            <path d="M12 15.5C9.33 15.5 4 16.84 4 19.5V20H20V19.5C20 16.84 14.67 15.5 12 15.5Z" fill="#00d2ff"/>
        </svg>
        <h1 class="text-xl font-bold neon-text">لوحة إدارة احمد البنا</h1>
    </header>

    <main class="container mx-auto px-4 space-y-8">
        
        <section class="glass-panel p-6 rounded-2xl shadow-2xl border border-cyan-500/20">
            <div class="flex items-center mb-6 space-x-2 space-x-reverse">
                <span class="p-2 bg-cyan-500/20 rounded-lg">✍️</span>
                <h2 id="form-title" class="text-lg font-semibold text-cyan-400">إضافة محتوى جديد</h2>
            </div>
            
            <div class="space-y-4">
                <input type="hidden" id="post-id">
                <input type="text" id="title" placeholder="عنوان الموضوع..." class="w-full p-4 rounded-xl outline-none transition-all">
                <input type="text" id="summary" placeholder="وصف قصير ..." class="w-full p-4 rounded-xl outline-none transition-all">
                <textarea id="content" rows="4" placeholder="اكتب المحتوى الكامل هنا..." class="w-full p-4 rounded-xl outline-none transition-all"></textarea>
                
                <div class="flex gap-3">
                    <button onclick="publishPost()" id="submit-btn" class="btn-active flex-1 py-4 bg-gradient-to-r from-cyan-600 to-blue-700 rounded-xl font-bold text-white shadow-lg shadow-cyan-900/40">نشر الآن 🚀</button>
                    <button onclick="cancelEdit()" id="cancel-btn" class="hidden px-6 py-4 bg-slate-700 text-gray-300 rounded-xl font-bold hover:bg-slate-600 transition">إلغاء</button>
                </div>
            </div>
        </section>

        <section class="glass-panel p-6 rounded-2xl shadow-xl">
            <div class="flex items-center mb-6 space-x-2 space-x-reverse">
                <span class="p-2 bg-purple-500/20 rounded-lg">📂</span>
                <h2 class="text-lg font-semibold text-purple-400">إدارة المنشورات الحالية</h2>
            </div>
            <div id="admin-posts-list" class="space-y-4">
                <div class="animate-pulse text-center text-slate-500">جاري التحميل...</div>
            </div>
        </section>
    </main>

    <div id="delete-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-8 border border-red-500/30 text-center scale-90 transition-transform duration-300" id="delete-modal-content">
            <div class="w-16 h-16 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-500/20 shadow-[0_0_15px_rgba(239,68,68,0.2)]">
                <span class="text-3xl">⚠️</span>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">تأكيد الحذف</h3>
            <p class="text-slate-400 mb-8 text-sm">هل أنت متأكد؟ لا يمكن التراجع عن الحذف نهائياً.</p>
            <div class="flex gap-3">
                <button onclick="executeDelete()" class="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold transition-all">حذف نهائي</button>
                <button onclick="closeDeleteModal()" class="flex-1 py-3 bg-slate-800 text-slate-300 rounded-xl font-bold hover:bg-slate-700 transition-all">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCPMD1_8oX5WcR1ib2BTui9a05yE3ko27I",
            databaseURL: "https://m-r-chat-hamo-default-rtdb.firebaseio.com",
            projectId: "m-r-chat-hamo"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const postsRef = ref(db, 'posts');
        let postToDelete = null;

        // النشر والتحديث
        window.publishPost = function() {
            const id = document.getElementById('post-id').value;
            const title = document.getElementById('title').value;
            const summary = document.getElementById('summary').value;
            const content = document.getElementById('content').value;

            if(!title || !content) return alert("يرجى تعبئة الحقول الأساسية");

            if(id) {
                update(ref(db, `posts/${id}`), { title, summary, content }).then(() => {
                    cancelEdit();
                });
            } else {
                const newPostRef = push(postsRef);
                set(newPostRef, { title, summary, content, timestamp: Date.now() }).then(() => {
                    clearInputs();
                });
            }
        };

        // تفعيل التعديل
        window.editPost = function(id, title, summary, content) {
            document.getElementById('post-id').value = id;
            document.getElementById('title').value = title;
            document.getElementById('summary').value = summary;
            document.getElementById('content').value = content;
            document.getElementById('form-title').innerText = "تعديل المحتوى";
            document.getElementById('submit-btn').innerText = "حفظ التعديلات ✅";
            document.getElementById('cancel-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelEdit = function() {
            clearInputs();
            document.getElementById('post-id').value = "";
            document.getElementById('form-title').innerText = "إضافة محتوى جديد";
            document.getElementById('submit-btn').innerText = "نشر الآن 🚀";
            document.getElementById('cancel-btn').classList.add('hidden');
        };

        // إدارة الحذف المطور
        window.deletePost = function(id) {
            postToDelete = id;
            const modal = document.getElementById('delete-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => document.getElementById('delete-modal-content').classList.remove('scale-90'), 10);
        };

        window.closeDeleteModal = function() {
            const modal = document.getElementById('delete-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.getElementById('delete-modal-content').classList.add('scale-90');
            postToDelete = null;
        };

        window.executeDelete = function() {
            if (postToDelete) {
                remove(ref(db, `posts/${postToDelete}`)).then(() => closeDeleteModal());
            }
        };

        function clearInputs() {
            document.querySelectorAll('input, textarea').forEach(i => i.value = "");
        }

        // عرض القائمة
        onValue(postsRef, (snapshot) => {
            const list = document.getElementById('admin-posts-list');
            list.innerHTML = "";
            const data = snapshot.val();
            if(!data) {
                list.innerHTML = '<p class="text-center text-slate-500 py-4">لا توجد بيانات</p>';
                return;
            }
            Object.keys(data).reverse().forEach(id => {
                const post = data[id];
                list.innerHTML += `
                    <div class="bg-slate-800/40 border border-slate-700 p-4 rounded-xl flex justify-between items-center group">
                        <div class="flex-1 ml-4 overflow-hidden">
                            <h3 class="font-medium text-cyan-100 truncate">${post.title}</h3>
                            <p class="text-xs text-slate-500">${new Date(post.timestamp).toLocaleDateString('ar-EG')}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editPost('${id}', '${post.title.replace(/'/g, "\\'")}', '${post.summary.replace(/'/g, "\\'")}', '${post.content.replace(/'/g, "\\'")}')" class="p-2 bg-cyan-500/10 text-cyan-400 rounded-lg border border-cyan-500/20">📝</button>
                            <button onclick="deletePost('${id}')" class="p-2 bg-red-500/10 text-red-500 rounded-lg border border-red-500/20">🗑️</button>
                        </div>
                    </div>`;
            });
        });
    </script>
</body>
</html>
